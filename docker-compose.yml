services:
  api:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://flip:flip@db:5432/flip_or_rip
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

  # Web client dev server (spec 006): Vite on :5173, proxying /api and /health to the api service.
  web:
    build: ./web
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app/web
      - /app/web/node_modules
    depends_on:
      - api

  # End-to-end + accessibility matrix (Playwright). Opt-in: docker compose --profile e2e run --rm e2e
  # The image tag must match the installed @playwright/test version.
  e2e:
    profiles: [e2e]
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /app/web
    volumes:
      - ./web:/app/web
      - /app/web/node_modules
    command: sh -c "npm ci && npx playwright test"
    ipc: host

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flip
      POSTGRES_PASSWORD: flip
      POSTGRES_DB: flip_or_rip
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flip -d flip_or_rip"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
